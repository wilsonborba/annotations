name: annotations_shared
description: Shared Annotations code for the browser and installed applications.
publish_to: none
version: 1.1.0+2
environment:
  sdk: ^3.11.1
resolution: workspace
dependencies:
  screen_trail: ^0.1.0
  flutter:
    sdk: flutter
  http: ^1.6.0
  crypto: ^3.0.6
  pdf: ^3.12.0
  # image 4.11.0 needs archive 4.1 while pdf allows archive below 4.1 only.
  image: ">=4.10.2 <4.11.0"
  go_router: ^17.5.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  web: ^1.1.1
  flutter_quill: 11.5.0
  html: 0.15.7
  quill_native_bridge: 11.1.0
  sqlite3: 3.5.2
  path_provider: 2.1.6
  super_clipboard: 0.9.1
  super_drag_and_drop: 0.9.1
  file_selector: 1.1.0
  pdfrx: 2.4.7
  qr: 3.0.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  assets:
    - lib/presentation/frontend/assets/images/
    - lib/presentation/frontend/assets/wasm/
    - lib/presentation/frontend/assets/icons/LICENSE
    - lib/presentation/frontend/assets/icons/NOTICE
    - lib/presentation/frontend/assets/fonts/UbuntuSans-LICENCE.txt
    - lib/presentation/frontend/assets/fonts/IBMPlexSansThai-LICENSE.txt
  fonts:
    - family: Ubuntu Sans
      fonts:
        - asset: lib/presentation/frontend/assets/fonts/UbuntuSans-Variable.ttf
        - asset: lib/presentation/frontend/assets/fonts/UbuntuSans-Italic-Variable.ttf
          style: italic
    - family: IBM Plex Sans Thai
      fonts:
        - asset: lib/presentation/frontend/assets/fonts/IBMPlexSansThai-Regular.ttf
        - asset: lib/presentation/frontend/assets/fonts/IBMPlexSansThai-SemiBold.ttf
          weight: 600
        - asset: lib/presentation/frontend/assets/fonts/IBMPlexSansThai-Bold.ttf
          weight: 700
