name: annotations
description: Asodya public notes, articles and temporary browser sharing.
publish_to: none
version: 1.1.0+2
environment:
  sdk: ^3.11.1
dependencies:
  asodya_tracking:
    git:
      url: https://github.com/wilsonborba/asodya_tracking.git
      ref: b01af5d41c10623bf02568a6db00f6beae3c4324
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  http: ^1.6.0
  go_router: ^17.5.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  web: ^1.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - lib/presentation/frontend/assets/images/
  fonts:
    - family: Ubuntu Sans
      fonts:
        - asset: lib/presentation/frontend/assets/fonts/UbuntuSans-Variable.ttf
        - asset: lib/presentation/frontend/assets/fonts/UbuntuSans-Italic-Variable.ttf
          style: italic
    - family: IBM Plex Sans Thai
      fonts:
        - asset: lib/presentation/frontend/assets/fonts/IBMPlexSansThai-Regular.ttf
