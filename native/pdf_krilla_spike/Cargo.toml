[package]
name = "pdf_krilla_spike"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "pdf_krilla_cli"
path = "src/main.rs"

[dependencies]
krilla = "0.7.0"
icu_segmenter = "2.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
